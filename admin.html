<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Studio | Signature Look</title>
  <link rel="stylesheet" href="css/theme.css">
  <style>
    body {
      background-color: var(--color-bg);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
    }

    /* Main Content Area */
    .admin-page-content {
      flex: 1 0 auto;
      padding: 40px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* Security Gate Modal */
    .login-modal-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1E372C 0%, #0F1D17 100%);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      background: #FFFFFF;
      border-radius: 8px;
      padding: 36px 28px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .login-brand-title {
      font-family: var(--font-serif);
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .login-subtitle {
      font-size: 0.72rem;
      color: var(--color-accent);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 24px;
      display: block;
    }

    .login-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.95rem;
      margin-bottom: 14px;
      text-align: center;
      letter-spacing: 0.1em;
      outline: none;
    }

    .login-input:focus {
      border-color: var(--color-primary);
    }

    .login-btn {
      width: 100%;
      background: var(--color-primary);
      color: #FFFFFF;
      padding: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-radius: 4px;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s ease;
    }

    .login-btn:hover {
      background-color: var(--color-primary-hover);
    }

    .login-error-text {
      color: var(--color-danger);
      font-size: 0.78rem;
      margin-top: 10px;
      display: none;
    }

    /* Admin Studio Form Container */
    .admin-wrapper {
      max-width: 760px;
      width: 100%;
      background: #FFFFFF;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 34px 28px;
      box-shadow: var(--shadow-subtle);
    }

    .admin-header {
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 20px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-title {
      font-family: var(--font-serif);
      font-size: 1.9rem;
      color: var(--color-primary);
    }

    .admin-header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .view-store-link {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-accent);
      font-weight: 600;
      border-bottom: 1px solid var(--color-accent);
    }

    .logout-btn {
      font-size: 0.72rem;
      color: var(--color-danger);
      font-weight: 600;
      text-transform: uppercase;
      padding: 5px 12px;
      border: 1px solid var(--color-danger);
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .logout-btn:hover {
      background: var(--color-danger);
      color: #FFFFFF;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .col-full { grid-column: 1 / -1; }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.76rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-main);
    }

    .form-control {
      padding: 10px 14px;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--color-primary);
    }

    .sizes-checkbox-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      padding-top: 6px;
    }

    .size-check-label {
      font-size: 0.84rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .admin-submit-btn {
      width: 100%;
      background-color: var(--color-primary);
      color: #FFFFFF;
      padding: 14px;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 4px;
      margin-top: 10px;
      border: none;
      cursor: pointer;
      transition: background-color 0.25s ease;
    }

    .admin-submit-btn:hover {
      background-color: var(--color-primary-hover);
    }

    .admin-submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .toast-status {
      padding: 12px 16px;
      border-radius: 4px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
    }

    .toast-status.success {
      background-color: #E8F5E9;
      color: #2E7D32;
      border: 1px solid #A5D6A7;
    }

    .toast-status.error {
      background-color: #FFEBEE;
      color: #C62828;
      border: 1px solid #EF9A9A;
    }
  </style>
</head>
<body>

  <!-- Security Gate Modal -->
  <div class="login-modal-overlay" id="login-gate">
    <div class="login-box">
      <h2 class="login-brand-title">Signature Look</h2>
      <span class="login-subtitle">Studio Security Gate</span>
      
      <form id="gate-form">
        <input 
          type="password" 
          id="gate-password" 
          class="login-input" 
          placeholder="Enter Admin Password / PIN" 
          autocomplete="current-password"
          required 
        />
        <button type="submit" class="login-btn">Unlock Studio</button>
        <p class="login-error-text" id="gate-error">Incorrect password. Please try again.</p>
      </form>
    </div>
  </div>

  <!-- Store Header Mount -->
  <div id="header-container"></div>

  <!-- Main Admin Workspace -->
  <main class="admin-page-content" id="admin-main-wrap" style="display: none;">
    <div class="admin-wrapper">
      <div class="admin-header">
        <div>
          <h1 class="admin-title">Product Studio</h1>
          <p style="font-size: 0.78rem; color: var(--color-text-muted);">Sync live inventory directly to Google Sheets database</p>
        </div>
        <div class="admin-header-actions">
          <a href="index.html" class="view-store-link" target="_blank">Store Preview ↗</a>
          <button type="button" class="logout-btn" id="logout-trigger">Lock Studio</button>
        </div>
      </div>

      <div id="toast-message" class="toast-status"></div>

      <form id="product-admin-form">
        <div class="form-grid">
          
          <div class="form-group col-full">
            <label for="prod-title">Product Title *</label>
            <input type="text" id="prod-title" class="form-control" placeholder="e.g. Royal Awadh Handcrafted Gharara Set" required />
          </div>

          <div class="form-group">
            <label for="prod-category">Category *</label>
            <select id="prod-category" class="form-control" required>
              <option value="suit-sets">Suit Sets</option>
              <option value="farshi-gharara">Farshi Gharara</option>
              <option value="coord-sets">Co-ord Sets</option>
              <option value="velvet-edit">Velvet Edit</option>
              <option value="anarkali">Anarkali</option>
              <option value="organza-dupatta">Organza Dupatta</option>
            </select>
          </div>

          <div class="form-group">
            <label for="prod-badge">Badge Tag (Optional)</label>
            <input type="text" id="prod-badge" class="form-control" placeholder="e.g. Bestseller, Heritage, New" />
          </div>

          <div class="form-group">
            <label for="prod-price">Selling Price (₹) *</label>
            <input type="number" id="prod-price" class="form-control" placeholder="2499" required />
          </div>

          <div class="form-group">
            <label for="prod-compare">Original MRP (₹)</label>
            <input type="number" id="prod-compare" class="form-control" placeholder="4999" />
          </div>

          <div class="form-group col-full">
            <label>Available Sizes</label>
            <div class="sizes-checkbox-row">
              <label class="size-check-label"><input type="checkbox" name="sizes" value="XS"> XS</label>
              <label class="size-check-label"><input type="checkbox" name="sizes" value="S" checked> S</label>
              <label class="size-check-label"><input type="checkbox" name="sizes" value="M" checked> M</label>
              <label class="size-check-label"><input type="checkbox" name="sizes" value="L" checked> L</label>
              <label class="size-check-label"><input type="checkbox" name="sizes" value="XL"> XL</label>
              <label class="size-check-label"><input type="checkbox" name="sizes" value="XXL"> XXL</label>
              <label class="size-check-label"><input type="checkbox" name="sizes" value="Free Size"> Free Size</label>
            </div>
          </div>

          <div class="form-group col-full">
            <label for="prod-primary-img">Primary Image URL *</label>
            <input type="url" id="prod-primary-img" class="form-control" placeholder="https://images.unsplash.com/..." required />
          </div>

          <div class="form-group col-full">
            <label for="prod-secondary-img">Secondary / Hover Image URL</label>
            <input type="url" id="prod-secondary-img" class="form-control" placeholder="Alternate angle photo URL" />
          </div>

          <div class="form-group col-full">
            <button type="submit" class="admin-submit-btn" id="submit-btn">
              Publish To Live Store
            </button>
          </div>

        </div>
      </form>
    </div>
  </main>

  <!-- Store Footer Mount -->
  <div id="footer-container"></div>

  <!-- Shared Component Scripts -->
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>

  <!-- Admin Controller Logic -->
  <script>
    // 1. CONFIGURATION
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzXt-5t6qmCF1d8CN-EIBgBZ6_HTJdgRKAnpOVkra8CuHicjq5gS-DQ1WT-_dEYE1Ui/exec';
    const ADMIN_SECRET_KEY = 'admin786';

    // 2. AUTHENTICATION CONTROLLER
    const gateModal = document.getElementById('login-gate');
    const adminMainWrap = document.getElementById('admin-main-wrap');
    const headerContainer = document.getElementById('header-container');
    const footerContainer = document.getElementById('footer-container');
    const gateForm = document.getElementById('gate-form');
    const gateInput = document.getElementById('gate-password');
    const gateError = document.getElementById('gate-error');
    const logoutBtn = document.getElementById('logout-trigger');

    function checkAuth() {
      const isAuth = sessionStorage.getItem('signature_admin_auth');
      if (isAuth === 'true') {
        gateModal.style.display = 'none';
        adminMainWrap.style.display = 'flex';
        headerContainer.style.display = 'block';
        footerContainer.style.display = 'block';
      } else {
        gateModal.style.display = 'flex';
        adminMainWrap.style.display = 'none';
        headerContainer.style.display = 'none';
        footerContainer.style.display = 'none';
        gateInput.focus();
      }
    }

    gateForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (gateInput.value === ADMIN_SECRET_KEY) {
        sessionStorage.setItem('signature_admin_auth', 'true');
        gateError.style.display = 'none';
        gateInput.value = '';
        checkAuth();
      } else {
        gateError.style.display = 'block';
        gateInput.select();
      }
    });

    logoutBtn.addEventListener('click', () => {
      sessionStorage.removeItem('signature_admin_auth');
      checkAuth();
    });

    checkAuth();

    // 3. PRODUCT SUBMISSION LOGIC
    const form = document.getElementById('product-admin-form');
    const submitBtn = document.getElementById('submit-btn');
    const toast = document.getElementById('toast-message');

    function showToast(msg, isSuccess = true) {
      toast.textContent = msg;
      toast.className = 'toast-status ' + (isSuccess ? 'success' : 'error');
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 5000);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const selectedSizes = Array.from(document.querySelectorAll('input[name="sizes"]:checked')).map(el => el.value);

      const payload = {
        title: document.getElementById('prod-title').value.trim(),
        category: document.getElementById('prod-category').value,
        price: document.getElementById('prod-price').value,
        comparePrice: document.getElementById('prod-compare').value,
        badge: document.getElementById('prod-badge').value.trim(),
        sizes: selectedSizes.length > 0 ? selectedSizes : ['Free Size'],
        primaryImage: document.getElementById('prod-primary-img').value.trim(),
        secondaryImage: document.getElementById('prod-secondary-img').value.trim(),
        status: 'active'
      };

      submitBtn.disabled = true;
      submitBtn.textContent = 'Publishing to Google Sheet...';

      try {
        const response = await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result && result.status === 'success') {
          showToast('✨ Product successfully published to Google Sheet database!');
          form.reset();
        } else {
          showToast('Failed to save: ' + (result.message || 'Unknown error'), false);
        }
      } catch (err) {
        showToast('Network error: ' + err.message, false);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Publish To Live Store';
      }
    });
  </script>
</body>
</html>
